name: Deploy digest preview

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preview to deploy
        required: true
        type: choice
        options:
          - marked
          - unmarked
        default: marked

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify project
        run: |
          pnpm test
          pnpm typecheck

      - name: Capture the digest page
        env:
          LANE_MARKER: ${{ secrets.LANE_MARKER }}
        run: |
          mkdir -p "$RUNNER_TEMP/s01e04-pages"
          bash scripts/capture-preview.sh "${{ inputs.mode }}" "$RUNNER_TEMP/s01e04-pages/index.html"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/s01e04-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
